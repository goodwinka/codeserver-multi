services:
  codeserver-multi:
    build: .
    image: codeserver-multi:latest
    container_name: codeserver-multi
    ports:
      - "18080:8080"
    volumes:
      # User home directories — bind-mount from host.
      # Каждая подпапка внутри — это отдельный пользователь: ./users/alice, ./users/bob, ...
      - ./users:/users
      # Конфиг (users.json и т.п.) — чтобы переживал пересборку контейнера
      - ./config:/config
      # Общие расширения — один раз установил, доступны всем
      - ./shared-extensions:/opt/shared-extensions
      # CUDA Toolkit с хоста (только чтение)
      - /usr/local/cuda:/usr/local/cuda:ro
    environment:
      # Меняйте перед первым запуском!
      SESSION_SECRET: "change-me-please-${RANDOM}${RANDOM}"
      # Администратор создаётся при первом старте, если его ещё нет в users.json
      BOOTSTRAP_ADMIN_USER: "admin123"
      BOOTSTRAP_ADMIN_PASSWORD: "admin123"
      # Разрешить самостоятельную регистрацию пользователей
      ALLOW_REGISTRATION: "true"
      # Имя cookie с сессией
      SESSION_COOKIE_NAME: "cs_sid"
      # API-ключ для Qwen Code (локальный LLM не требует настоящего ключа)
      QWEN_API_KEY: "sk-no-key-required"
      # NVIDIA runtime vars
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_HOME: "/usr/local/cuda"
      PATH: "/usr/local/cuda/bin:${PATH}"
      LD_LIBRARY_PATH: "/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:${LD_LIBRARY_PATH}"
    restart: unless-stopped
    # Дать контейнеру доступ к GPU (требуется nvidia-container-toolkit на хосте)
    runtime: nvidia
    gpus: all
    #device_requests:
    #  - driver: nvidia
    #    count: -1
    #    capabilities: [gpu, utility, compute]
    # code-server любит много file watchers
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
